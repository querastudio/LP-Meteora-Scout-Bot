[project]
name = "lpscout"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = ["httpx==0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["lpscout"]
