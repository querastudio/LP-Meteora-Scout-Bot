name: LP Scout Bot

# Scans Meteora DLMM X/SOL pools every 5 minutes and alerts via Telegram.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: "Send a sample POOL ALERT to Telegram instead of scanning (preview format)"
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: |
            cooldown_cache.json
            bot_state.json
          key: cooldown-${{ github.run_id }}
          restore-keys: cooldown-

      - name: Send test alert (manual preview only)
        if: github.event_name == 'workflow_dispatch' && inputs.send_test_alert == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_test_alert.py

      - name: Run bot
        if: github.event_name != 'workflow_dispatch' || inputs.send_test_alert != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY:     ${{ secrets.HELIUS_API_KEY }}
          ALCHEMY_API_KEY:    ${{ secrets.ALCHEMY_API_KEY }}
          ENABLE_MINT_FREEZE_CHECK: ${{ vars.ENABLE_MINT_FREEZE_CHECK }}
          ENABLE_TOP10_CHECK:       ${{ vars.ENABLE_TOP10_CHECK }}
          ENABLE_HOLDERS_CHECK:     ${{ vars.ENABLE_HOLDERS_CHECK }}
        run: python main.py
