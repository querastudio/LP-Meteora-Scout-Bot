name: LP Scout Bot

# Scans Meteora DLMM X/SOL pools every 5 minutes and alerts via Telegram.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: cooldown_cache.json
          key: cooldown-${{ github.run_id }}
          restore-keys: cooldown-

      - name: DEBUG - probe Meteora API endpoints
        run: |
          set +e
          for url in \
            "https://dlmm-api.meteora.ag/pair/all" \
            "https://dlmm-api.meteora.ag/pair/all_with_pagination?page=0&limit=2" \
            "https://dlmm-api.meteora.ag/pair/all_by_groups" \
            "https://dlmm-api.meteora.ag/" \
            "https://amm-v2.meteora.ag/pools" \
            "https://amm-v2.meteora.ag/pair/all" \
            "https://dammv2-api.meteora.ag/pools" \
            "https://stats-api.dex.meteora.ag/pair/all" \
            ; do
            echo "=== $url ==="
            code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" --max-time 15 "$url")
            echo "HTTP $code"
            head -c 400 /tmp/resp.txt
            echo
            echo
          done

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          HELIUS_API_KEY:     ${{ secrets.HELIUS_API_KEY }}
          ALCHEMY_API_KEY:    ${{ secrets.ALCHEMY_API_KEY }}
        run: python main.py
